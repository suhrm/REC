[package]
name = "rec"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.75"
axum = "0.7.4"
iced = { version = "0.10.0", features = ["tokio", "canvas", "lazy"] }
iced_widget = { version = "0.1.3", features = ["lazy"] }
include_dir = "0.7.3"
obws = "0.11.5"
socketioxide = "0.10.2"
tokio = { version = "1.35.0", features = ["full"] }
